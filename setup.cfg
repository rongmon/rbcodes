# This file is used to configure your project.
# Read more about the various options under:
# https://setuptools.pypa.io/en/latest/userguide/declarative_config.html
# https://setuptools.pypa.io/en/latest/references/keywords.html

[metadata]
name = rbcodes
version = attr: rbcodes.__version__
description = Python tools for analyzing spectroscopic data
author = Rongmon Bordoloi
author_email = rongmon.bordoloi@gmail.com
license = MIT
license_files = LICENSE.txt
long_description = file: docs/main_readme.md
long_description_content_type = text/markdown
url = https://github.com/rongmon/rbcodes
project_urls =
    Documentation = https://github.com/rongmon/rbcodes/blob/master/docs/main_readme.md
    Source = https://github.com/rongmon/rbcodes

# Change if running only on Windows, Mac or Linux (comma-separated)
platforms = any

# Add here all kinds of additional classifiers as defined under
# https://pypi.org/classifiers/
classifiers =
    Development Status :: 4 - Beta
    Programming Language :: Python


[options]
zip_safe = False
packages = find_namespace:
include_package_data = True
package_dir =
    =src

# Require a min/specific Python version (comma-separated conditions)
# Only Python 3.12 is tested; raise the upper bound after testing a newer Python.
python_requires = >=3.12,<3.13


# Lower bounds: oldest versions that support NumPy 2 and Python 3.12 (checked by
# the "minimum" test job). Upper bounds: next major version after the tested one,
# to keep out breaking releases. The exact tested set is in requirements-py312-lock.txt.
install_requires =
    PyQt5>=5.15.10,<6
    numpy>=2.0,<3
    scipy>=1.13,<2
    matplotlib>=3.9,<4
    astropy>=6.1,<9
    pandas>=2.2.2,<4
    linetools>=0.3.2,<0.4
    emcee>=3.1,<4
    photutils>=1.13,<4
    corner>=2.2,<3
    scikit-learn>=1.5,<2
    tqdm>=4.65,<5
    regions>=0.9,<1
    ipywidgets>=8.0,<9


[options.package_data]
rbcodes.halo =
    smhm_med*_params.txt
    um_dr1_hm_averages.npz
rbcodes.IGM =
    lines/*.dat
    lines/*.lst
rbcodes.GUIs.multispecviewer =
    line_options.conf
rbcodes.GUIs.zgui =
    gui_linelists.ascii
rbcodes.GUIs.interactive_continuum_fit_help =
    help.html
rbcodes.GUIs.zfind =
    templates/marz/*.fits
    templates/sdss/*.fits
    templates/pca/*.fits
    templates/README.md

[options.packages.find]
where = src
exclude =
    tests

[options.extras_require]
# Add here additional requirements for extra features, to install with:
# `pip install rbcodes[PDF]` like:
# PDF = ReportLab; RXP

# Add here test requirements (semicolon/line-separated)
testing =
    pytest>=8,<10
    pytest-cov>=5,<8

[options.entry_points]
console_scripts =
    rb_multispec = rbcodes.GUIs.multispecviewer.rb_multispec:main
    launch_specgui = rbcodes.GUIs.launch_specgui:launch
    rb_llsfitter = rbcodes.GUIs.LLSFitter_GUI:main
    rb_zgui = rbcodes.GUIs.zgui.main:main
    rb_zfind = rbcodes.GUIs.zfind.main:main
    rb_ifuview = rbcodes.GUIs.ifuviewer.rb_ifuview:main
    rb_selftest = rbcodes._selftest:main

[tool:pytest]
# Specify command line options as you would do when invoking pytest directly.
# e.g. --cov-report html (or xml) for html/xml output or --junitxml junit.xml
# in order to write a coverage file that can be read by Jenkins.
# CAUTION: --cov flags may prohibit setting breakpoints while debugging.
#          Comment those flags to avoid this pytest issue.
addopts =
    --cov rbcodes --cov-report term-missing
    --verbose
norecursedirs =
    dist
    build
    .tox
testpaths = tests
# Use pytest markers to select/deselect specific tests
# markers =
#     slow: mark tests as slow (deselect with '-m "not slow"')
#     system: mark end-to-end system tests

[devpi:upload]
# Options for the devpi: PyPI server and packaging tool
# VCS export must be deactivated since we are using setuptools-scm
no_vcs = 1
formats = bdist_wheel

[flake8]
# Some sane defaults for the code style checker flake8
max_line_length = 88
extend_ignore = E203, W503
# ^  Black-compatible
#    E203 and W503 have edge cases handled by black
exclude =
    .tox
    build
    dist
    .eggs

[pyscaffold]
# PyScaffold's parameters when the project was created.
# This will be used when updating. Do not change!
version = 4.6
package = rbcodes
extensions =
    no_skeleton
